<h1>My Courses </h1>
<a href="/student/dashboard/">Back to Dashboard</a>

{% for course in courses %}
    <div style="background:white;padding:20px;margin:15px;border-radius:10px;">
        <h3>{{ course.title }}</h3>
        <p>{{ course.description }}</p>
    </div>
{% empty %}
    <p>No courses available.</p>
{% endfor %}
