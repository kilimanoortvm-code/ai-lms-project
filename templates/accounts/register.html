<!DOCTYPE html>
<html>
<head>
    <title>LMS Register</title>

    <style>
        body {
    margin: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #f1f5f9;
}


.header {
    width: 100%;
    height: 60px;
    background: #0f172a;
    color: white;
    display: flex;
    align-items: center;
    overflow: hidden;
}


.moving-text {
    white-space: nowrap;
    display: inline-block;
    padding-left: 100%;
    animation: moveText 12s linear infinite;
    font-size: 18px;  
    font-weight: bold;
}

@keyframes moveText {
    0% { transform: translateX(0%); }
    100% { transform: translateX(-100%); }
}


.container {
    display: flex;
    justify-content: center;
    align-items: center;
    height: calc(100vh - 60px); 
}


.form-box {
    background: white;
    padding: 20px;              
    width: 360px;              
    border-radius: 12px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.1);
}


h2 {
    text-align: center;
    margin-bottom: 15px;
}


input, select {
    width: 100%;
    padding: 10px;            
    margin: 6px 0 10px;
    border-radius: 6px;
    border: 1px solid #ccc;
}

button {
    width: 100%;
    padding: 10px;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 6px;
}


.link {
    text-align: center;
    margin-top: 10px;
}
    </style>
</head>

<body>

<div class="header">
    <div class="moving-text">
        Welcome to LMS - Learning Management System
    </div>
</div>

<div class="container">
    <div class="form-box">

        <h2>Create Account</h2>

        {% if form.errors %}
            <div class="error">
                {{ form.errors }}
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <label>Username</label>
            {{ form.username }}

            <label>Email</label>
            {{ form.email }}

            <label>Password</label>
            {{ form.password1 }}

            <label>Confirm Password</label>
            {{ form.password2 }}

            <div class="role-box">
                <label>Select Role</label>
                {{ form.role }}
            </div>

            <button type="submit">Register</button>
        </form>

        <div class="link">
            Already have an account? <a href="/login/">Login</a>
        </div>

    </div>
</div>

</body>
</html>
