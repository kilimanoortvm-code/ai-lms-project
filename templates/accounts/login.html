<!DOCTYPE html>
<html>
<head>
    <title>LMS Login</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f1f5f9;
        }

        .header {
            width: 100%;
            height: 60px;
            background: #0f172a;
            color: white;
            display: flex;
            align-items: center;
            overflow: hidden;
        }

        .moving-text {
            white-space: nowrap;
            display: inline-block;
            padding-left: 100%;
            animation: moveText 12s linear infinite;
            font-size: 22px;
            font-weight: bold;
        }

        @keyframes moveText {
            0% {
                transform: translateX(0%);
            }
            100% {
                transform: translateX(-100%);
            }
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 60px);
        }

        .form-box {
            background: white;
            padding: 35px;
            width: 400px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #0f172a;
        }

        label {
            font-weight: 600;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            box-sizing: border-box;
        }

        .role-box {
            margin: 10px 0 20px;
        }

        .role-box input {
            width: auto;
            margin-right: 8px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .error {
            color: red;
            background: #fee2e2;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .link {
            text-align: center;
            margin-top: 18px;
        }

        .link a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="header">
    <div class="moving-text">
        Welcome to LMS - Learning Management System
    </div>
</div>

<div class="container">
    <div class="form-box">

        <h2>Login</h2>

        {% if form.errors %}
            <div class="error">
                Invalid username or password. Please try again.
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <label>Username</label>
            {{ form.username }}

            <label>Password</label>
            {{ form.password }}

            <div class="role-box">
                <label>Select Role</label><br><br>

                <input type="radio" name="role" value="teacher" required> Teacher
                <br><br>

                <input type="radio" name="role" value="student" required> Student
            </div>

            <button type="submit">Login</button>
        </form>

        <div class="link">
            Don’t have an account? <a href="/register/">Register</a>
        </div>

    </div>
</div>

</body>
</html>
